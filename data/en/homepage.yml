############################## Testimonial ##########################
testimonial:
  enable: true
  title: "Review sản phẩm"
  testimonial_item:
    # testimonial item loop
    - name: "Mark Zuckerberg"
      designation: "CEO of Facebook"
      image: "images/avater-1.png"
      content: "DXH đã chứng tỏ được sự chuyên nghiệp và khả năng thấu hiểu thị hiếu cộng đồng mạng Việt Nam một cách hoàn hảo. Tốc độ nắm bắt drama (Kẹo Kera), tinh thần meme ('tận cùng nỗi đau' của Fan T1) và sự hài hước trong ngôn ngữ là không thể chê vào đâu được. Dịch vụ không chỉ giải quyết yêu cầu mà còn nâng tầm nó lên thành những đoạn nội dung huyền thoại đầy tính giải trí. Tôi hoàn toàn tin tưởng và sẽ tiếp tục 'xin vía' sự sáng tạo từ đội ngũ này!"

    # testimonial item loop
    - name: "Huang Loc"
      designation: "CEO of Slipper Company"
      image: "images/avater-2.png"
      content: "Với vai trò CEO của thương hiệu Dép Lào, tôi hoàn toàn hài lòng với hiệu quả hợp tác từ Công ty/Nền tảng này. Họ đã biến sản phẩm bình dân của chúng tôi thành huyền thoại với meme 'đáy xã hội' một cách cực kỳ thông minh. Khả năng thấu hiểu thương hiệu và lồng ghép ngôn ngữ viral như 'Vũ khí Tối Thượng' đã giúp Dép Lào 36 trở thành 'The Boss' trong lòng người tiêu dùng."
    # testimonial item loop
    - name: "Duck Khoi"
      designation: "CEO of DuckDuck"
      image: "images/avater-3.png"
      content: "Từ góc độ CEO của DuckDuck, tôi vô cùng ấn tượng với sự linh hoạt và khả năng biến hóa ý tưởng của Công ty đối tác này. Họ đã giúp những chú vịt của chúng tôi trở thành 'Vũ khí Tối Thượng' trên mạng xã hội, tránh được mọi 'drama' không cần thiết. Mọi nội dung đều được làm rất 'chất' và lan tỏa, giúp chúng tôi 'xin vía' sự chú ý của giới trẻ. Đặc biệt, cách lồng ghép meme tinh tế, giúp sản phẩm của chúng tôi không bị xếp vào 'đáy xã hội' mà luôn giữ được vị thế 'The Boss' đầy độc đáo. 'Đã làm là phải chất,' và họ đã chứng minh điều đó!"